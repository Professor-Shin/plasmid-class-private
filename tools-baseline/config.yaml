# Four published tools as baselines on the mixed-length test split:
# Platon, MOB-suite (mob_recon), PLASMe and PlasmidHunter.
#
# None of them is retrained: all four are run exactly as released, as database-,
# rule- or pretrained-model-based predictors. What this config controls is the
# harness around them. The fifth baseline in the comparison, Zou et al., IS a
# retrained model and lives in baseline/run_zou_mixed.py instead.

upstream:
  platon:
    url: "https://github.com/oschwengers/platon"
    docs: "https://gensoft.pasteur.fr/docs/platon/1.7/"
    paper: "Schwengers et al. 2020, Microb Genom, doi:10.1099/mgen.0.000398"
    install: "conda install -c conda-forge -c bioconda platon"
    database: "https://zenodo.org/record/4066768/files/db.tar.gz"
  mobsuite:
    url: "https://github.com/phac-nml/mob-suite"
    paper: "Robertson & Nash 2018, Microb Genom, doi:10.1099/mgen.0.000206"
    install: "conda install -c conda-forge -c bioconda mob_suite"
    database: "mob_init (figshare), mirror https://zenodo.org/records/10304948"
  plasme:
    url: "https://github.com/HubertTang/PLASMe"
    paper: "Tang et al. 2023, Nucleic Acids Res, doi:10.1093/nar/gkad578"
    install: "git clone + conda env (see server/00_setup_envs.sh)"
    database: "https://zenodo.org/record/8046934/files/DB.zip (12.4 GB, md5 b32263ad4fb20c04044700170b1609ef)"
    version_read: "PLASMe_v1.1"
  plasmidhunter:
    url: "https://github.com/tianrenmaogithub/PlasmidHunter"
    paper: "Tian et al. 2024, Brief Bioinform, doi:10.1093/bib/bbae322"
    install: "pip install plasmidhunter (+ conda diamond=2.1.8 prodigal)"
    database: "https://zenodo.org/records/10431696/files/database.dmnd.gz (DIAMOND)"
    version_read: "1.4"

dataset_dir: "../dataset pipeline1/data/dataset_mixed"
# Results land next to the retrained baselines so analysis/dump_tables.py and
# baseline/summarize.py find them without a second results root.
results_dir: "../baseline/results_mixed"
shard_dir: "shards"
out_dir: "out"

# Only the test split is run: both tools are untrained, so train/validation would
# buy nothing but CPU hours. shard_by_assembly.py takes --split if that changes.
split: "test"

# One shard per assembly. The test split's fragments tile each replicon without
# overlap and never cross a split boundary, so an assembly's fragments ARE a
# fragmented draft assembly - exactly the input both tools were designed for,
# rather than a pile of unrelated sequences.
shard_by: "assembly_accession"

platon:
  # A single --characterize run reports RDS and every hallmark column for every
  # contig, from which all three published filter modes are re-derived offline
  # (see toolbase/rules.py). Without the flag the TSV holds only plasmid calls.
  characterize: true
  modes: ["sensitivity", "accuracy", "specificity"]

mobsuite:
  # mob_recon discards contigs below this length, so anything dropped has to be
  # re-joined as "unclassified" rather than silently disappearing. The dataset's
  # shortest fragment is 1,000 bp, which sits exactly on this boundary.
  min_length: 1000

plasme:
  # PLASMe is run once at its own CLI defaults and every preset mode is recovered
  # offline from the candidate table it leaves in --temp, exactly as Platon's
  # three filter modes are recovered from one --characterize run. The thresholds
  # themselves are transcribed from PLASMe.py into toolbase/rules.PLASME_MODES,
  # not configured here, so they cannot drift away from the published values.
  modes: ["high_sensitivity", "balance", "high_precision"]
  # Kept because the runner must NOT delete it: PLASMe_candidate.csv, the only
  # file with one row per aligned contig, lives in the temporary directory.
  keep_temp: true

plasmidhunter:
  # PlasmidHunter filters contigs below this length itself (functions.filter_fasta,
  # `len(seq) >= 1000`). The dataset's shortest fragment is 1,001 bp, so nothing
  # is lost to it - but the collector still reports how many fragments fell below
  # it rather than assuming that stays true.
  min_length: 1000

# Every tool can decline to classify a fragment - Platon when it finds no marker
# protein, mob_recon below its length cutoff, PLASMe when a contig aligns to
# nothing, PlasmidHunter when a contig's proteins produce no DIAMOND hit - so
# three policies are reported rather than one, the same way
# baseline/baselines/metrics.plasflow_threshold_rule already handles PlasFlow's
# "unclassified" band.
unclassified_policies: ["chromosome", "plasmid", "exclude"]
