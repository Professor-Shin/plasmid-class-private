# Proposed model: ESM-2 protein embeddings + trainable attention pooling over ORFs,
# re-implemented from `old resource/09_train_esm2.py` and `10_esm_attention.py`
# and trained on the RefSeq 5-kb fragment dataset.

# The prototype this is transcribed from; checksummed into results/environment.json.
upstream:
  directory: "../old resource"
  files: ["09_train_esm2.py", "10_esm_attention.py"]
  previous_result: "esm_attn_res.txt"

dataset_dir: "../dataset pipeline1/data/dataset_mixed"
baseline_dir: "../baseline/results"
cache_dir: "cache_mixed"
results_dir: "results_mixed"

# The mixed-length dataset has no single fragment length; kept for the manifest only.
fragment_length: null
random_seed: 42

# Feature ladder. Each variant reuses the ONE cached ESM embedding pass and only
# changes which auxiliary columns the classifier head receives, so the whole
# ladder costs one embedding run. See esm2/composition.py for what each block is
# and why it is biologically motivated.
#   gc  - GC content and its local heterogeneity          (4 dims)
#   ori - origin-of-replication composition proxy:
#         cumulative GC-skew turn, AT-rich DUE window,
#         DnaA-box density, iteron/direct-repeat density   (8 dims)
variants:
  esm2: []
  esm2+gc: ["gc"]
  esm2+ori: ["ori"]
  esm2+gc+ori: ["gc", "ori"]

esm:
  model_name: "facebook/esm2_t6_8M_UR50D"
  hidden_size: 320
  max_length: 1024          # tokenizer truncation, as in the prototype
  torch_threads: 8
  # ORFs are embedded in length-sorted batches capped by total tokens instead of a
  # fixed count of 8; the mean-pooled embeddings are numerically identical and it is
  # 2.4x faster because almost no padding is computed.
  batch_tokens: 8192

orf:
  min_length: 100           # minimum peptide length in amino acids
  max_orfs: 10              # keep the longest N ORFs per fragment

# On the mixed-length dataset ESM-2 costs ~1.6 s per fragment (measured), not the
# ~0.44 s of the 5-kb dataset: the ten longest ORFs of a long fragment are
# themselves long. The 112,929-fragment dataset therefore cannot be embedded in
# full. Each split is sampled per class and every metric is re-weighted to the
# split's true composition (see REPORT.md section 3.3).
# MEASURED cost on the mixed-length dataset: ~10-12 ORFs/s sustained, i.e. roughly
# 0.8 s/fragment. Peptides are embedded in length-sorted, token-capped batches, so
# the throughput in ORFs/s falls as the run proceeds (the long peptides come last
# and attention is quadratic in length). The mean ORF here is 479 aa against 305 aa
# on the 5-kb dataset, which is why this is ~2x the old per-fragment cost rather
# than the same.
#
# Sized for a ~45 min embedding budget on 8 CPU cores. The TEST split takes every
# plasmid fragment (416) so the reported minority-class numbers are not a sample of
# a sample; train/validation plasmids are sampled. Chromosomes are sampled in all
# splits and every metric is re-weighted to the split's true composition.
#
# This is a deliberate statistical-power compromise to fit the time budget, NOT a
# scientific choice: the full-dataset evidence lives in the composition baselines
# (baseline/run_composition.py), which use all 112,929 fragments.
subsample:
  train: {plasmid: 900, chromosome: 1100}
  validation: {plasmid: 250, chromosome: 350}
  test: {plasmid: 999999, chromosome: 600}

train:
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  dropout: 0.3
  classifier_hidden: 64
  batch_size: 1             # the prototype takes one fragment per optimisation step
  n_seeds: 2                # 3 in the published 5-kb run; cut to fit the time budget
  torch_threads: 2
